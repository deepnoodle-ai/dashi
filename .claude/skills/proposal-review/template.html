<title>__TITLE__</title>
<style>
  :root {
    --bg: #f6f5f1;
    --surface: #ffffff;
    --ink: #1e2227;
    --muted: #626a75;
    --faint: #8a919b;
    --line: #dedbd3;
    --accent: #2f5d8a;
    --accent-soft: #e8eff6;
    --ok: #2e7d4f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial,
      sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #15181c; --surface: #1c2025; --ink: #e4e7ea; --muted: #a0a8b1;
      --faint: #6f7883; --line: #2f353d; --accent: #82b2e0;
      --accent-soft: #212f3d; --ok: #6cc08b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #15181c; --surface: #1c2025; --ink: #e4e7ea; --muted: #a0a8b1;
    --faint: #6f7883; --line: #2f353d; --accent: #82b2e0;
    --accent-soft: #212f3d; --ok: #6cc08b;
  }
  body {
    background: var(--bg); color: var(--ink);
    font: 14.5px/1.45 var(--sans);
    padding-block: 24px 88px; padding-inline: 16px;
  }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.45rem; line-height: 1.2; margin: 0; text-wrap: balance; }
  .meta { color: var(--muted); font-size: 0.85rem; margin: 2px 0 18px; }
  .eyebrow {
    font-size: 0.68rem; letter-spacing: 0.07em; text-transform: uppercase;
    color: var(--faint); font-weight: 600;
  }
  code { font-family: var(--mono); font-size: 0.88em; }

  /* Labeled rows: a narrow label column and text. Used for the page context
     and for each question's facts. */
  .facts { display: grid; grid-template-columns: 84px 1fr; gap: 3px 12px; }
  .facts .k {
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; padding-top: 3px;
  }
  .facts .v { margin: 0; }
  .facts .v ul { margin: 0; padding-left: 16px; }
  .context {
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 12px 0; margin: 0 0 22px;
  }
  .context p { margin: 0 0 6px; }
  .context p:last-child { margin: 0; }

  .q {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; padding: 12px 14px 10px; margin-bottom: 10px;
    display: grid; gap: 8px;
  }
  .q header { display: grid; grid-template-columns: 26px 1fr; gap: 6px; align-items: baseline; }
  .q .num {
    color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums;
    font-size: 1rem;
  }
  .q h2 { font-size: 1rem; line-height: 1.3; margin: 0; text-wrap: balance; }
  .q h2 .topic { color: var(--muted); font-weight: 500; }
  .q .why { color: var(--muted); margin: 0; font-size: 0.92rem; }
  .q .facts { font-size: 0.92rem; padding-left: 32px; }
  .q .facts .k { padding-top: 2px; }

  .opts { display: grid; gap: 2px; padding-left: 26px; }
  .opt {
    display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start;
    padding: 4px 6px; border-radius: 4px; border: 1px solid transparent;
    cursor: pointer;
  }
  .opt:hover { background: var(--accent-soft); }
  .opt:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
  .opt input { margin: 3px 0 0; accent-color: var(--accent); }
  .opt .label { font-weight: 600; }
  .opt .desc { color: var(--muted); }
  .opt .desc::before { content: " — "; color: var(--faint); }
  .opt .rec {
    font-size: 0.64rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--ok); font-weight: 700; margin-left: 6px; vertical-align: 1px;
  }
  .cmt {
    display: grid; grid-template-columns: 84px 1fr; gap: 3px 12px;
    align-items: start; padding-left: 32px;
  }
  .cmt label {
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--faint); font-weight: 600; padding-top: 8px;
  }
  textarea {
    width: 100%; box-sizing: border-box; min-height: 34px; resize: vertical;
    font: inherit; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px;
    field-sizing: content;
  }
  textarea:focus, .opt input:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
    background: var(--surface); border-top: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; justify-content: center;
    flex-wrap: wrap;
  }
  .bar .status { color: var(--muted); font-size: 0.85rem; }
  button {
    font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
    background: var(--accent); color: var(--surface);
    border: 0; border-radius: 4px; padding: 6px 14px;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  #out {
    font-family: var(--mono); font-size: 0.8rem; min-height: 140px;
    margin-top: 8px; white-space: pre; overflow-x: auto; field-sizing: fixed;
  }
  details summary { cursor: pointer; color: var(--muted); margin-top: 20px; font-size: 0.9rem; }
  @media (max-width: 520px) {
    .facts { grid-template-columns: 1fr; gap: 0 0; }
    .facts .k { padding-top: 6px; }
    .q .facts, .opts, .cmt { padding-left: 0; }
    .cmt { grid-template-columns: 1fr; }
  }
</style>

<main>
  <div class="eyebrow">Proposal review</div>
  <h1 id="title"></h1>
  <div class="meta" id="meta"></div>
  <div class="context" id="context"></div>
  <div id="questions"></div>
  <details>
    <summary>Compiled responses (what the copy button copies)</summary>
    <textarea id="out" readonly aria-label="Compiled responses"></textarea>
  </details>
</main>

<div class="bar">
  <span class="status" id="status">0 of 0 answered</span>
  <button id="copy">Copy responses</button>
  <button id="clear" class="ghost">Clear</button>
</div>

<script type="application/json" id="review-data">
__DATA__
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('review-data').textContent);
  var key = 'proposal-review:' + (data.id || data.title);
  var state = {};
  try { state = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { state = {}; }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function save() { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }

  // facts: [{label, text}] or [{label, items: [..]}]; strings become plain
  // paragraphs. Returns a node or null.
  function factsNode(list) {
    if (!list || !list.length) return null;
    var wrap = el('div', 'facts');
    list.forEach(function (f) {
      if (typeof f === 'string') {
        wrap.appendChild(el('div', 'k', ''));
        wrap.appendChild(el('p', 'v', inline(f)));
        return;
      }
      wrap.appendChild(el('div', 'k', esc(f.label || '')));
      var v;
      if (f.items && f.items.length) {
        v = el('div', 'v', '<ul>' + f.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>');
      } else {
        v = el('p', 'v', inline(f.text));
      }
      wrap.appendChild(v);
    });
    return wrap;
  }

  document.getElementById('title').textContent = data.title;
  var meta = [];
  if (data.source) meta.push(data.source);
  if (data.date) meta.push(data.date);
  document.getElementById('meta').innerHTML = meta.map(esc).join(' · ');

  var ctx = document.getElementById('context');
  var structured = (data.context || []).some(function (c) { return typeof c !== 'string'; });
  if (structured) {
    ctx.appendChild(factsNode(data.context));
  } else {
    (data.context || []).forEach(function (p) { ctx.appendChild(el('p', null, inline(p))); });
  }

  var qwrap = document.getElementById('questions');
  data.questions.forEach(function (q, i) {
    var n = i + 1;
    var st = state[n] = state[n] || { choices: [], comment: '' };
    var card = el('section', 'q');
    card.id = 'q' + n;
    var head = el('header');
    head.appendChild(el('span', 'num', n + '.'));
    head.appendChild(el('h2', null,
      (q.topic ? '<span class="topic">' + esc(q.topic) + ' · </span>' : '') + inline(q.question)));
    card.appendChild(head);
    var facts = factsNode(q.facts);
    if (facts) card.appendChild(facts);
    if (q.why) { var why = el('p', 'why', inline(q.why)); why.style.paddingLeft = '32px'; card.appendChild(why); }

    var opts = el('div', 'opts');
    var type = q.multi ? 'checkbox' : 'radio';
    (q.options || []).forEach(function (o, j) {
      var id = 'q' + n + 'o' + j;
      var lab = el('label', 'opt');
      lab.setAttribute('for', id);
      var inp = document.createElement('input');
      inp.type = type; inp.name = 'q' + n; inp.id = id; inp.value = o.label;
      inp.checked = st.choices.indexOf(o.label) >= 0;
      inp.addEventListener('change', function () {
        if (q.multi) {
          st.choices = Array.prototype.slice.call(opts.querySelectorAll('input:checked')).map(function (x) { return x.value; });
        } else {
          st.choices = [o.label];
        }
        save(); render();
      });
      var txt = el('div', null,
        '<span class="label">' + inline(o.label) + '</span>' +
        (o.recommended ? '<span class="rec">recommended</span>' : '') +
        (o.desc ? '<span class="desc">' + inline(o.desc) + '</span>' : ''));
      lab.appendChild(inp); lab.appendChild(txt);
      opts.appendChild(lab);
    });
    card.appendChild(opts);

    var cmt = el('div', 'cmt');
    var cl = el('label', null, 'Note');
    cl.setAttribute('for', 'c' + n);
    var ta = document.createElement('textarea');
    ta.id = 'c' + n; ta.value = st.comment; ta.rows = 1;
    ta.placeholder = 'Add, change, or push back';
    ta.addEventListener('input', function () { st.comment = ta.value; save(); render(); });
    cmt.appendChild(cl); cmt.appendChild(ta);
    card.appendChild(cmt);
    qwrap.appendChild(card);
  });

  var out = document.getElementById('out');
  var status = document.getElementById('status');
  function compile() {
    var lines = ['Responses to: ' + data.title];
    if (data.source) lines.push('Document: ' + data.source);
    lines.push('');
    data.questions.forEach(function (q, i) {
      var n = i + 1, st = state[n];
      lines.push(n + '. ' + (q.topic ? q.topic + ' — ' : '') + q.question);
      lines.push('   Choice: ' + (st.choices.length ? st.choices.join('; ') : '(none)'));
      if (st.comment.trim()) lines.push('   Comment: ' + st.comment.trim().replace(/\n/g, '\n            '));
      lines.push('');
    });
    return lines.join('\n').trim() + '\n';
  }
  function render() {
    out.value = compile();
    var answered = data.questions.filter(function (q, i) {
      var st = state[i + 1]; return st.choices.length || st.comment.trim();
    }).length;
    status.textContent = answered + ' of ' + data.questions.length + ' answered';
  }
  render();

  document.getElementById('copy').addEventListener('click', function () {
    var text = compile();
    var done = function () { status.textContent = 'Copied to clipboard'; };
    var fallback = function () {
      out.closest('details').open = true; out.focus(); out.select();
      status.textContent = 'Select-all and copy the text below';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  });
  document.getElementById('clear').addEventListener('click', function () {
    var btn = this;
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1'; btn.textContent = 'Really clear?';
      setTimeout(function () { btn.dataset.armed = ''; btn.textContent = 'Clear'; }, 3000);
      return;
    }
    state = {}; save(); location.reload();
  });
})();
</script>
