<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
  /* Light palette. Every token is defined here; the dark blocks below only
     redefine them. Teal marks selection and numbering; ochre marks the
     recommended option, so the two never read as the same signal. */
  :root {
    --bg: #eef0ee;
    --sheet: #ffffff;
    --ink: #15191e;
    --ink-2: #2e353d;
    --label: #56616c;
    --rule: #d6dbd8;
    --rule-strong: #b9c0bc;
    --accent: #0b6461;
    --accent-ink: #ffffff;
    --accent-wash: #e1f0ee;
    --hover: #f3f6f5;
    --rec: #8a5300;
    --rec-wash: #faefd9;
    --code-bg: #e9eceb;
    --code-ink: #243039;
    --field: #f8f9f8;
    --shadow: 0 1px 2px rgba(20, 30, 28, 0.06);
    --serif: "Source Serif 4", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
      Helvetica, Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
      monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #121517; --sheet: #1b1f22; --ink: #eef1f0; --ink-2: #d2d8d6;
      --label: #9aa6a3; --rule: #2c3336; --rule-strong: #3d4649;
      --accent: #5cc2b8; --accent-ink: #0c1a19; --accent-wash: #173230;
      --hover: #21272a; --rec: #e0a54a; --rec-wash: #33270f;
      --code-bg: #283033; --code-ink: #dfe6e4; --field: #15191b;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121517; --sheet: #1b1f22; --ink: #eef1f0; --ink-2: #d2d8d6;
    --label: #9aa6a3; --rule: #2c3336; --rule-strong: #3d4649;
    --accent: #5cc2b8; --accent-ink: #0c1a19; --accent-wash: #173230;
    --hover: #21272a; --rec: #e0a54a; --rec-wash: #33270f;
    --code-bg: #283033; --code-ink: #dfe6e4; --field: #15191b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink-2);
    font: 15px/1.5 var(--sans);
    padding: 28px 16px 104px;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 800px; margin: 0 auto; }
  code {
    font-family: var(--mono); font-size: 0.9em; color: var(--code-ink);
    background: var(--code-bg); padding: 0.05em 0.3em; border-radius: 3px;
    overflow-wrap: anywhere;
  }

  /* Masthead */
  .masthead { margin-bottom: 22px; }
  .kicker {
    font: 500 0.8rem/1 var(--mono); color: var(--accent);
    letter-spacing: 0.02em; margin: 0 0 8px;
  }
  h1 {
    font: 700 1.9rem/1.15 var(--serif); color: var(--ink);
    margin: 0; text-wrap: balance; letter-spacing: -0.01em;
  }
  .meta {
    font: 0.85rem/1.4 var(--mono); color: var(--label); margin: 6px 0 0;
    overflow-wrap: anywhere;
  }

  /* Definition lists: the page context and each question's facts. */
  .dl { display: grid; grid-template-columns: 7.25rem 1fr; margin: 0; }
  .dl dt, .dl dd { margin: 0; padding: 5px 0; border-top: 1px solid var(--rule); }
  .dl > :first-child, .dl > :first-child + dd { border-top: 0; }
  .dl dt {
    font-weight: 600; font-size: 0.87rem; color: var(--label);
    padding-right: 12px; padding-top: 6px;
  }
  .dl dd { color: var(--ink-2); min-width: 0; }
  .dl dd.plain { grid-column: 1 / -1; }
  .dl ul { margin: 0; padding-left: 1.1em; }
  .dl li + li { margin-top: 2px; }
  .dl li::marker { color: var(--label); }

  .context { margin: 0 0 28px; }
  .section-head {
    font: 600 0.8rem/1 var(--mono); color: var(--label);
    text-transform: uppercase; letter-spacing: 0.08em;
    border-bottom: 2px solid var(--ink); padding-bottom: 7px; margin: 0 0 2px;
  }
  .context-body > p { margin: 8px 0 0; }

  /* Question sheets */
  .q {
    background: var(--sheet); border: 1px solid var(--rule);
    border-top: 3px solid var(--accent); box-shadow: var(--shadow);
    padding: 14px 20px 16px; margin: 0 0 18px;
    scroll-margin-top: 16px;
  }
  .q-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .num {
    font: 600 0.85rem/1 var(--mono); font-variant-numeric: tabular-nums;
    color: var(--accent-ink); background: var(--accent);
    min-width: 2.2em; padding: 4px 6px; text-align: center; border-radius: 2px;
  }
  .topic { font-weight: 600; font-size: 0.87rem; color: var(--accent); }
  .q h2 {
    font: 600 1.28rem/1.3 var(--serif); color: var(--ink);
    margin: 0 0 10px; text-wrap: pretty;
  }
  .q h2 code { font-size: 0.8em; }
  .why { margin: 0 0 10px; color: var(--ink-2); font-style: italic; }
  .q .dl {
    font-size: 0.95rem; margin-bottom: 12px;
    border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  }

  /* Options: a stacked list of bordered rows that read as choosable. */
  .field-label {
    display: block; font-weight: 600; font-size: 0.87rem; color: var(--label);
    margin: 0 0 5px;
  }
  .opts { display: grid; gap: 5px; margin: 0 0 12px; }
  .opt {
    display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start;
    padding: 6px 12px 7px; border: 1px solid var(--rule-strong); border-radius: 4px;
    background: var(--sheet); cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  .opt:hover { background: var(--hover); }
  .opt:has(input:checked) {
    background: var(--accent-wash); border-color: var(--accent);
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt input {
    width: 17px; height: 17px; margin: 2px 0 0; accent-color: var(--accent);
    cursor: pointer;
  }
  .opt-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .opt .label { font-weight: 600; color: var(--ink); }
  .opt:has(input:checked) .label { color: var(--accent); }
  /* The description sits beside the label when it fits and wraps under it
     when it does not; weight and color keep the two apart. */
  .opt .desc { color: var(--label); font-size: 0.93rem; flex: 1 1 18em; min-width: 0; }
  .rec {
    font: 600 0.76rem/1 var(--mono); color: var(--rec); background: var(--rec-wash);
    padding: 3px 6px; border-radius: 2px; white-space: nowrap;
  }

  textarea {
    width: 100%; min-height: 40px; resize: vertical; display: block;
    font: inherit; color: var(--ink); background: var(--field);
    border: 1px solid var(--rule-strong); border-radius: 4px; padding: 8px 10px;
    field-sizing: content;
  }
  .flags { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 8px; }
  .flag {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 0.85rem; font-weight: 500; color: var(--label);
    border: 1px dashed var(--rule-strong); border-radius: 999px;
    padding: 4px 11px;
  }
  .flag:hover { background: var(--hover); }
  .flag input { margin: 0; accent-color: var(--rec); }
  .flag:has(input:checked) {
    color: var(--rec); background: var(--rec-wash);
    border-style: solid; border-color: var(--rec);
  }
  .flag:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  textarea::placeholder { color: var(--label); }
  textarea:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  textarea:focus-visible { border-color: var(--accent); }

  /* Compiled output */
  details { margin-top: 26px; border-top: 1px solid var(--rule); padding-top: 12px; }
  summary { cursor: pointer; color: var(--label); font-weight: 600; font-size: 0.9rem; }
  #out {
    font-family: var(--mono); font-size: 0.82rem; line-height: 1.5; min-height: 160px;
    margin-top: 10px; white-space: pre; overflow-x: auto; field-sizing: fixed;
  }

  /* Bottom bar, aligned to the reading column. */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: var(--sheet); border-top: 1px solid var(--rule-strong);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  .bar-inner {
    max-width: 800px; margin: 0 auto;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  .status {
    font: 500 0.88rem/1.3 var(--mono); color: var(--ink-2); margin-right: auto;
  }
  button {
    font: 600 0.92rem/1 var(--sans); cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    border: 1px solid var(--accent); border-radius: 4px; padding: 9px 16px;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--ink-2); border-color: var(--rule-strong); }
  button.ghost[data-armed="1"] { color: var(--rec); border-color: var(--rec); }

  @media (max-width: 560px) {
    body { padding-top: 20px; }
    h1 { font-size: 1.6rem; }
    .dl { grid-template-columns: 1fr; }
    .dl dt { padding: 7px 0 0; }
    .dl dd { border-top: 0; padding-top: 1px; }
    .q { padding: 12px 14px 14px; }
    .q h2 { font-size: 1.18rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .opt { transition: none; }
  }
</style>

<main>
  <header class="masthead">
    <p class="kicker">Proposal review</p>
    <h1 id="title"></h1>
    <p class="meta" id="meta"></p>
  </header>
  <section class="context" aria-labelledby="context-head">
    <h2 class="section-head" id="context-head">Context</h2>
    <div class="context-body" id="context"></div>
  </section>
  <div id="questions"></div>
  <details>
    <summary>Compiled responses (what the copy button copies)</summary>
    <textarea id="out" readonly aria-label="Compiled responses"></textarea>
  </details>
</main>

<div class="bar">
  <div class="bar-inner">
    <span class="status" id="status" aria-live="polite">0 of 0 answered</span>
    <button id="copy">Copy responses</button>
    <button id="clear" class="ghost">Clear</button>
  </div>
</div>

<script type="application/json" id="review-data">
__DATA__
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById('review-data').textContent);
  var key = 'proposal-review:' + (data.id || data.title);
  var state = {};
  try { state = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) { state = {}; }

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function inline(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
  function save() { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} }

  // facts: [{label, text}] or [{label, items: [..]}]; plain strings span both
  // columns. Returns a <dl> or null.
  function factsNode(list) {
    if (!list || !list.length) return null;
    var dl = el('dl', 'dl');
    list.forEach(function (f) {
      if (typeof f === 'string') {
        dl.appendChild(el('dd', 'plain', inline(f)));
        return;
      }
      dl.appendChild(el('dt', null, esc(f.label || '')));
      if (f.items && f.items.length) {
        dl.appendChild(el('dd', null, '<ul>' + f.items.map(function (i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>'));
      } else {
        dl.appendChild(el('dd', null, inline(f.text)));
      }
    });
    return dl;
  }

  document.getElementById('title').textContent = data.title;
  var meta = [];
  if (data.source) meta.push(data.source);
  if (data.date) meta.push(data.date);
  document.getElementById('meta').innerHTML = meta.map(esc).join(' · ');

  var ctx = document.getElementById('context');
  var structured = (data.context || []).some(function (c) { return typeof c !== 'string'; });
  if (structured) {
    ctx.appendChild(factsNode(data.context));
  } else {
    (data.context || []).forEach(function (p) { ctx.appendChild(el('p', null, inline(p))); });
  }
  if (!(data.context || []).length) ctx.parentNode.hidden = true;

  var FLAGS = [
    { key: 'unclear', label: 'Question doesn\u2019t make sense',
      text: 'question does not make sense' },
    { key: 'analysis', label: 'Needs its own analysis',
      text: 'needs dedicated analysis' }
  ];

  var qwrap = document.getElementById('questions');
  data.questions.forEach(function (q, i) {
    var n = i + 1;
    var st = state[n] = state[n] || { choices: [], comment: '' };
    var card = el('section', 'q');
    card.id = 'q' + n;
    card.setAttribute('aria-labelledby', 'q' + n + 'h');
    var head = el('div', 'q-head');
    head.appendChild(el('span', 'num', String(n)));
    if (q.topic) head.appendChild(el('span', 'topic', esc(q.topic)));
    card.appendChild(head);
    var h = el('h2', null, inline(q.question));
    h.id = 'q' + n + 'h';
    card.appendChild(h);
    var facts = factsNode(q.facts);
    if (facts) card.appendChild(facts);
    if (q.why) card.appendChild(el('p', 'why', inline(q.why)));

    var type = q.multi ? 'checkbox' : 'radio';
    var ol = el('div', 'field-label', q.multi ? 'Choose any that apply' : 'Choose one');
    ol.id = 'q' + n + 'l';
    card.appendChild(ol);
    var opts = el('div', 'opts');
    opts.setAttribute('role', 'group');
    opts.setAttribute('aria-labelledby', 'q' + n + 'l');
    (q.options || []).forEach(function (o, j) {
      var id = 'q' + n + 'o' + j;
      var lab = el('label', 'opt');
      lab.setAttribute('for', id);
      var inp = document.createElement('input');
      inp.type = type; inp.name = 'q' + n; inp.id = id; inp.value = o.label;
      inp.checked = st.choices.indexOf(o.label) >= 0;
      inp.addEventListener('change', function () {
        if (q.multi) {
          st.choices = Array.prototype.slice.call(opts.querySelectorAll('input:checked')).map(function (x) { return x.value; });
        } else {
          st.choices = [o.label];
        }
        save(); render();
      });
      var txt = el('div', null,
        '<span class="opt-line"><span class="label">' + inline(o.label) + '</span>' +
        (o.recommended ? '<span class="rec">Recommended</span>' : '') +
        (o.desc ? '<span class="desc">' + inline(o.desc) + '</span>' : '') + '</span>');
      lab.appendChild(inp); lab.appendChild(txt);
      opts.appendChild(lab);
    });
    card.appendChild(opts);

    // Flags question the question itself; they sit beside any choice.
    st.flags = st.flags || [];
    var flags = el('div', 'flags');
    flags.setAttribute('role', 'group');
    flags.setAttribute('aria-label', 'Flag this question');
    var ta = document.createElement('textarea');
    function placeholder() {
      if (st.flags.indexOf('unclear') >= 0) return 'What is wrong with the question?';
      if (st.flags.indexOf('analysis') >= 0) return 'What should the analysis cover?';
      return 'Add, change, or push back';
    }
    FLAGS.forEach(function (f) {
      var id = 'q' + n + 'f' + f.key;
      var lab = el('label', 'flag');
      lab.setAttribute('for', id);
      var inp = document.createElement('input');
      inp.type = 'checkbox'; inp.id = id;
      inp.checked = st.flags.indexOf(f.key) >= 0;
      inp.addEventListener('change', function () {
        st.flags = st.flags.filter(function (k) { return k !== f.key; });
        if (inp.checked) st.flags.push(f.key);
        ta.placeholder = placeholder();
        save(); render();
      });
      lab.appendChild(inp);
      lab.appendChild(document.createTextNode(f.label));
      flags.appendChild(lab);
    });
    card.appendChild(flags);

    var cl = el('label', 'field-label', 'Note');
    cl.setAttribute('for', 'c' + n);
    ta.id = 'c' + n; ta.value = st.comment; ta.rows = 1;
    ta.placeholder = placeholder();
    ta.addEventListener('input', function () { st.comment = ta.value; save(); render(); });
    card.appendChild(cl); card.appendChild(ta);
    qwrap.appendChild(card);
  });

  var out = document.getElementById('out');
  var status = document.getElementById('status');
  function compile() {
    var lines = ['Responses to: ' + data.title];
    if (data.source) lines.push('Document: ' + data.source);
    lines.push('');
    data.questions.forEach(function (q, i) {
      var n = i + 1, st = state[n];
      lines.push(n + '. ' + (q.topic ? q.topic + ' — ' : '') + q.question);
      var fl = FLAGS.filter(function (f) { return (st.flags || []).indexOf(f.key) >= 0; });
      if (fl.length) lines.push('   Flag: ' + fl.map(function (f) { return f.text; }).join('; '));
      lines.push('   Choice: ' + (st.choices.length ? st.choices.join('; ') : '(none)'));
      if (st.comment.trim()) lines.push('   Comment: ' + st.comment.trim().replace(/\n/g, '\n            '));
      lines.push('');
    });
    return lines.join('\n').trim() + '\n';
  }
  function render() {
    out.value = compile();
    var answered = data.questions.filter(function (q, i) {
      var st = state[i + 1];
      return st.choices.length || st.comment.trim() || (st.flags || []).length;
    }).length;
    status.textContent = answered + ' of ' + data.questions.length + ' answered';
  }
  render();

  document.getElementById('copy').addEventListener('click', function () {
    var text = compile();
    var done = function () { status.textContent = 'Copied to clipboard'; };
    var fallback = function () {
      out.closest('details').open = true; out.focus(); out.select();
      status.textContent = 'Select-all and copy the text below';
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  });
  document.getElementById('clear').addEventListener('click', function () {
    var btn = this;
    if (btn.dataset.armed !== '1') {
      btn.dataset.armed = '1'; btn.textContent = 'Really clear?';
      setTimeout(function () { btn.dataset.armed = ''; btn.textContent = 'Clear'; }, 3000);
      return;
    }
    state = {}; save(); location.reload();
  });
})();
</script>
