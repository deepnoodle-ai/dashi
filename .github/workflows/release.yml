name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Release notes are written
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" --check
      - name: go test
        run: make test
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.15.3 # brews is deprecated; upgrade deliberately
          args: release --clean --release-notes docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # The release commit carries the root tag and every sub-module tag.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
